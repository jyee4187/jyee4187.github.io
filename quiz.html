<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quiz</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:  #09090b;
      --c0:  #e21b3c;
      --c1:  #1368ce;
      --c2:  #d89e00;
      --c3:  #26890c;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }

    /* ── screens ── */
    .screen {
      display: none;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
    }
    .screen.active { display: flex; }

    /* ── lobby ── */
    #lobby h1 {
      font-size: clamp(28px, 6vw, 48px);
      font-weight: 800;
      letter-spacing: -1.5px;
      text-align: center;
      margin-bottom: 10px;
    }
    #lobby p {
      font-size: 14px;
      color: #52525b;
      margin-bottom: 40px;
      text-align: center;
    }
    .btn-start {
      background: #fff;
      color: #09090b;
      border: none;
      font-size: 15px;
      font-weight: 700;
      padding: 14px 40px;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: opacity .15s;
    }
    .btn-start:hover { opacity: .88; }

    /* ── question screen ── */
    #question {
      justify-content: space-between;
      padding: 0;
      gap: 0;
    }

    /* top bar */
    .top {
      width: 100%;
      padding: 18px 24px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .top-num   { font-size: 11px; color: #52525b; letter-spacing: 1px; text-transform: uppercase; }
    .top-score { font-size: 13px; font-weight: 600; color: #a1a1aa; }
    .top-timer {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      width: 48px;
      text-align: center;
      transition: color .3s;
    }
    .top-timer.warn { color: #f97316; }
    .top-timer.crit { color: #ef4444; }

    /* progress */
    .progress {
      width: 100%;
      height: 2px;
      background: #18181b;
      flex-shrink: 0;
    }
    .progress-fill {
      height: 100%;
      background: #52525b;
      transition: width .35s ease;
    }

    /* question text */
    .q-text {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 28px;
      text-align: center;
      font-size: clamp(18px, 4vw, 28px);
      font-weight: 600;
      line-height: 1.35;
      color: #fafafa;
      width: 100%;
      max-width: 720px;
      align-self: center;
    }

    /* answer grid */
    .answers {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      flex-shrink: 0;
    }
    .ans {
      border: none;
      padding: 24px 20px;
      min-height: 88px;
      font-size: clamp(14px, 2.5vw, 17px);
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      text-align: left;
      line-height: 1.3;
      transition: filter .15s;
      display: flex;
      align-items: center;
    }
    .ans:hover:not(:disabled) { filter: brightness(1.08); }
    .ans:disabled { cursor: default; }
    .ans.c0 { background: var(--c0); }
    .ans.c1 { background: var(--c1); }
    .ans.c2 { background: var(--c2); }
    .ans.c3 { background: var(--c3); }
    .ans.correct { outline: 3px solid #fff; outline-offset: -3px; }
    .ans.wrong   { filter: brightness(.4); }

    /* ── feedback ── */
    #feedback {
      gap: 12px;
      text-align: center;
    }
    .fb-emoji { font-size: 56px; line-height: 1; }
    .fb-label { font-size: 26px; font-weight: 800; }
    .fb-pts   { font-size: 15px; color: #71717a; margin-top: 4px; }

    /* ── results ── */
    #results { gap: 24px; max-width: 420px; width: 100%; }
    #results h2 { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: #52525b; }
    .score-big { font-size: 72px; font-weight: 900; letter-spacing: -3px; line-height: 1; }
    .score-label { font-size: 12px; color: #52525b; margin-top: 2px; }

    .bars { width: 100%; display: flex; flex-direction: column; gap: 6px; }
    .bar-row { display: flex; align-items: center; gap: 10px; }
    .bar-n    { font-size: 10px; color: #52525b; width: 14px; text-align: right; flex-shrink: 0; }
    .bar-track { flex: 1; height: 6px; background: #18181b; border-radius: 3px; overflow: hidden; }
    .bar-fill  { height: 100%; border-radius: 3px; }
    .bar-fill.ok  { background: var(--c3); }
    .bar-fill.bad { background: var(--c0); }
    .bar-meta { font-size: 10px; color: #3f3f46; width: 28px; text-align: right; flex-shrink: 0; }

    @media (max-width: 480px) {
      .answers { grid-template-columns: 1fr; }
      .ans { min-height: 64px; }
    }
  </style>
</head>
<body>

<div id="lobby" class="screen active">
  <h1 id="quiz-title">Quiz</h1>
  <p id="quiz-desc"></p>
  <button class="btn-start" onclick="start()">Start</button>
</div>

<div id="question" class="screen">
  <div class="top">
    <span class="top-num" id="q-num"></span>
    <span class="top-timer" id="timer">20</span>
    <span class="top-score" id="score-disp">0</span>
  </div>
  <div class="progress"><div class="progress-fill" id="prog"></div></div>
  <div class="q-text" id="q-text"></div>
  <div class="answers" id="answers"></div>
</div>

<div id="feedback" class="screen">
  <div class="fb-emoji" id="fb-emoji"></div>
  <div class="fb-label" id="fb-label"></div>
  <div class="fb-pts"   id="fb-pts"></div>
</div>

<div id="results" class="screen">
  <h2>Score</h2>
  <div class="score-big" id="final-score"></div>
  <div class="score-label">points</div>
  <div class="bars" id="bars"></div>
  <button class="btn-start" onclick="start()">Again</button>
</div>

<script>
var Q = [
  { q:'What does CSS stand for?',
    a:['Cascading Style Sheets','Computer Style System','Creative Sheet Syntax','Coded Styling Standard'], c:0, t:20 },
  { q:'Which data structure is LIFO?',
    a:['Queue','Stack','Linked List','Tree'], c:1, t:20 },
  { q:'Time complexity of binary search?',
    a:['O(n)','O(n²)','O(log n)','O(1)'], c:2, t:20 },
  { q:'React hook for side effects?',
    a:['useState','useRef','useEffect','useMemo'], c:2, t:15 },
  { q:'HTTP status code for "Not Found"?',
    a:['200','301','403','404'], c:3, t:15 },
  { q:'Which is NOT a JavaScript type?',
    a:['undefined','boolean','character','symbol'], c:2, t:20 },
  { q:'What does git stash do?',
    a:['Deletes changes','Saves changes temporarily','Commits silently','Pushes to remote'], c:1, t:20 },
  { q:'Shortest path algorithm?',
    a:['Merge Sort','Dijkstra\'s','Binary Search','Bubble Sort'], c:1, t:20 },
  { q:'What does SQL stand for?',
    a:['Structured Query Language','Simple Question Logic','System Queue Layer','Standard Query Loop'], c:0, t:15 },
  { q:'What is a REST API?',
    a:['A database type','An architectural style for web services','A JavaScript framework','A CSS methodology'], c:1, t:20 },
];

document.getElementById('quiz-title').textContent = 'How much do you know?';
document.getElementById('quiz-desc').textContent  = Q.length + ' questions';

var idx, score, results, tick, timeLeft;

function start() {
  idx = 0; score = 0; results = [];
  show('question');
  load();
}

function load() {
  var q = Q[idx];
  timeLeft = q.t;

  document.getElementById('q-num').textContent    = (idx+1) + ' / ' + Q.length;
  document.getElementById('score-disp').textContent = score.toLocaleString() + ' pts';
  document.getElementById('q-text').textContent   = q.q;
  document.getElementById('prog').style.width     = (idx / Q.length * 100) + '%';

  var box = document.getElementById('answers');
  box.innerHTML = '';
  q.a.forEach(function(text, i) {
    var b = document.createElement('button');
    b.className = 'ans c' + i;
    b.textContent = text;
    b.onclick = function() { pick(i); };
    box.appendChild(b);
  });

  runTimer(q.t);
}

function runTimer(secs) {
  clearInterval(tick);
  var el = document.getElementById('timer');
  el.className = 'top-timer';
  var start = Date.now();

  tick = setInterval(function() {
    timeLeft = Math.max(0, secs - (Date.now() - start) / 1000);
    el.textContent = Math.ceil(timeLeft);
    el.className = 'top-timer' + (timeLeft < 5 ? ' crit' : timeLeft < 10 ? ' warn' : '');
    if (timeLeft <= 0) { clearInterval(tick); pick(-1); }
  }, 100);
}

function pick(chosen) {
  clearInterval(tick);
  var q = Q[idx];
  var ok  = chosen === q.c;
  var pts = ok ? Math.round(1000 * (timeLeft / q.t)) : 0;
  score  += pts;
  results.push({ ok: ok, t: q.t - timeLeft });

  document.querySelectorAll('.ans').forEach(function(b, i) {
    b.disabled = true;
    if (i === q.c) b.classList.add('correct');
    else           b.classList.add('wrong');
  });

  setTimeout(function() { feedback(ok, pts, q.a[q.c]); }, 700);
}

function feedback(ok, pts, correct) {
  document.getElementById('fb-emoji').textContent = ok ? '✓' : '✗';
  document.getElementById('fb-label').textContent = ok
    ? ['Correct','Nice','Yes','Let\'s go'][Math.floor(Math.random()*4)]
    : correct;
  document.getElementById('fb-pts').textContent   = ok ? '+' + pts + ' pts' : 'wrong';
  document.getElementById('fb-emoji').style.color = ok ? '#22c55e' : '#ef4444';
  show('feedback');

  setTimeout(function() {
    idx++;
    if (idx < Q.length) { show('question'); load(); }
    else { showResults(); }
  }, 1400);
}

function showResults() {
  document.getElementById('final-score').textContent = score.toLocaleString();
  document.getElementById('bars').innerHTML = results.map(function(r, i) {
    var pct = r.ok ? Math.max(8, Math.round((1 - r.t / Q[i].t) * 100)) : 100;
    return '<div class="bar-row">' +
      '<span class="bar-n">' + (i+1) + '</span>' +
      '<div class="bar-track"><div class="bar-fill ' + (r.ok ? 'ok' : 'bad') + '" style="width:' + pct + '%"></div></div>' +
      '<span class="bar-meta">' + (r.ok ? r.t.toFixed(1)+'s' : '—') + '</span>' +
      '</div>';
  }).join('');
  show('results');
}

function show(id) {
  document.querySelectorAll('.screen').forEach(function(s) {
    s.classList.toggle('active', s.id === id);
  });
}
</script>
</body>
</html>
