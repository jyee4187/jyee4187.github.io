<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quiz</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:  #08080f;
      --c0:  #e8193c;
      --c1:  #1368ce;
      --c2:  #d4880a;
      --c3:  #1fa810;
      --shadow0: #8a0f22;
      --shadow1: #0a3d7a;
      --shadow2: #7a5000;
      --shadow3: #0f6308;
      --purple: #8b5cf6;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: 'Space Grotesk', system-ui, sans-serif;
      color: #fff;
      overflow: hidden;
    }

    /* ── screens ─────────────────────────────── */
    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
    }
    .screen.active {
      opacity: 1;
      pointer-events: all;
    }

    /* ── lobby ───────────────────────────────── */
    #lobby {
      background: radial-gradient(ellipse at 50% 0%, #1a0a3e 0%, var(--bg) 65%);
      gap: 0;
    }
    .lobby-tag {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--purple);
      margin-bottom: 20px;
      font-weight: 600;
    }
    .lobby-title {
      font-size: clamp(36px, 8vw, 68px);
      font-weight: 800;
      letter-spacing: -2px;
      text-align: center;
      line-height: 1.05;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #fff 30%, #c4b5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .lobby-sub {
      font-size: 14px;
      color: #52525b;
      margin-bottom: 48px;
    }
    .btn-play {
      background: var(--purple);
      color: #fff;
      border: none;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      padding: 15px 52px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 6px 0 #4c1d95;
      transition: transform .1s, box-shadow .1s;
      letter-spacing: .5px;
    }
    .btn-play:hover  { transform: translateY(-2px); box-shadow: 0 8px 0 #4c1d95; }
    .btn-play:active { transform: translateY(4px);  box-shadow: 0 2px 0 #4c1d95; }

    /* ── question screen ─────────────────────── */
    #question {
      padding: 0;
      justify-content: space-between;
    }

    /* header */
    .hdr {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px 12px;
      flex-shrink: 0;
    }
    .hdr-num {
      font-size: 12px;
      font-weight: 600;
      color: #3f3f46;
      letter-spacing: 1px;
      text-transform: uppercase;
      min-width: 70px;
    }
    .hdr-score {
      font-size: 13px;
      font-weight: 700;
      color: #71717a;
      min-width: 70px;
      text-align: right;
    }

    /* timer ring */
    .timer-wrap {
      position: relative;
      width: 56px;
      height: 56px;
    }
    .timer-wrap svg { transform: rotate(-90deg); }
    .t-track { fill: none; stroke: #18181b; stroke-width: 4; }
    .t-fill  {
      fill: none;
      stroke: var(--purple);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 144;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset .1s linear, stroke .4s;
    }
    .timer-num {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 800;
    }
    .timer-wrap.warn .t-fill { stroke: #f97316; }
    .timer-wrap.crit .t-fill { stroke: #ef4444; }
    .timer-wrap.crit { animation: pulse .5s ease-in-out infinite alternate; }
    @keyframes pulse { to { transform: scale(1.08); } }

    /* progress */
    .prog-bar { width: 100%; height: 2px; background: #18181b; flex-shrink: 0; }
    .prog-fill { height: 100%; background: #27272a; transition: width .35s; }

    /* question */
    .q-box {
      flex: 1;
      width: 100%;
      max-width: 760px;
      align-self: center;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 32px;
    }
    .q-text {
      font-size: clamp(18px, 3.5vw, 28px);
      font-weight: 700;
      text-align: center;
      line-height: 1.3;
      color: #fafafa;
      animation: fadeUp .3s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* answer grid */
    .answers {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      flex-shrink: 0;
    }
    .ans {
      border: none;
      font-family: inherit;
      font-size: clamp(14px, 2vw, 17px);
      font-weight: 700;
      color: #fff;
      padding: 0 24px;
      min-height: 84px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      line-height: 1.3;
      position: relative;
      transition: filter .15s, transform .12s;
      animation: fadeUp .3s ease both;
    }
    .ans:nth-child(1) { animation-delay: .05s; }
    .ans:nth-child(2) { animation-delay: .10s; }
    .ans:nth-child(3) { animation-delay: .15s; }
    .ans:nth-child(4) { animation-delay: .20s; }

    .ans::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 5px;
      background: rgba(0,0,0,0.35);
    }
    .ans:hover:not(:disabled) { filter: brightness(1.1); transform: scale(1.01); z-index: 1; }
    .ans:active:not(:disabled){ transform: scale(.98); }
    .ans:disabled { cursor: default; }

    .ans.c0 { background: var(--c0); }
    .ans.c1 { background: var(--c1); }
    .ans.c2 { background: var(--c2); }
    .ans.c3 { background: var(--c3); }

    .ans.correct { outline: 3px solid #fff; outline-offset: -3px; filter: brightness(1.15); }
    .ans.wrong   { filter: brightness(.25); }

    .ans-letter {
      width: 30px; height: 30px;
      background: rgba(0,0,0,0.25);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800;
      flex-shrink: 0;
    }

    /* ── feedback ─────────────────────────────── */
    #feedback {
      background: radial-gradient(ellipse at 50% 40%, #111 0%, var(--bg) 70%);
      gap: 14px;
      text-align: center;
    }
    .fb-mark {
      font-size: 64px;
      line-height: 1;
      animation: pop .35s cubic-bezier(.17,.67,.35,1.4) both;
    }
    @keyframes pop {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    .fb-word { font-size: 28px; font-weight: 800; animation: fadeUp .25s .15s both; }
    .fb-pts  { font-size: 15px; color: #52525b; animation: fadeUp .25s .25s both; }
    .fb-ans  { font-size: 13px; color: #3f3f46; margin-top: -4px; animation: fadeUp .25s .3s both; }

    /* ── results ─────────────────────────────── */
    #results {
      background: radial-gradient(ellipse at 50% 0%, #1a0a3e 0%, var(--bg) 65%);
      gap: 20px;
      max-width: 420px;
      width: 100%;
      padding: 32px 24px;
    }
    .res-label { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #3f3f46; font-weight: 600; }
    .res-score { font-size: clamp(52px, 12vw, 80px); font-weight: 800; letter-spacing: -3px; line-height: 1;
      background: linear-gradient(135deg, #fff 30%, #c4b5fd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .res-pts   { font-size: 12px; color: #3f3f46; margin-top: -8px; }

    .bars { width: 100%; display: flex; flex-direction: column; gap: 7px; }
    .bar-row { display: flex; align-items: center; gap: 10px; }
    .bar-n    { font-size: 10px; color: #3f3f46; width: 16px; text-align: right; flex-shrink: 0; font-weight: 600; }
    .bar-track { flex: 1; height: 7px; background: #18181b; border-radius: 4px; overflow: hidden; }
    .bar-fill  { height: 100%; border-radius: 4px; transition: width .6s cubic-bezier(.2,1,.4,1); }
    .bar-fill.ok  { background: var(--c3); }
    .bar-fill.bad { background: var(--c0); }
    .bar-t { font-size: 10px; color: #3f3f46; width: 30px; text-align: right; flex-shrink: 0; }

    @media (max-width: 480px) {
      .answers { grid-template-columns: 1fr; }
      .ans { min-height: 64px; }
    }
  </style>
</head>
<body>

<!-- Lobby -->
<div id="lobby" class="screen active">
  <div class="lobby-tag">Quiz</div>
  <div class="lobby-title" id="lobby-title">How much<br>do you know?</div>
  <div class="lobby-sub" id="lobby-sub">10 questions · up to 1000 pts each</div>
  <button class="btn-play" onclick="start()">Play</button>
</div>

<!-- Question -->
<div id="question" class="screen">
  <div class="hdr">
    <span class="hdr-num" id="q-num">1 / 10</span>
    <div class="timer-wrap" id="timer-wrap">
      <svg width="56" height="56" viewBox="0 0 56 56">
        <circle class="t-track" cx="28" cy="28" r="23"/>
        <circle class="t-fill"  cx="28" cy="28" r="23" id="t-arc"/>
      </svg>
      <div class="timer-num" id="t-num">20</div>
    </div>
    <span class="hdr-score" id="hdr-score">0 pts</span>
  </div>
  <div class="prog-bar"><div class="prog-fill" id="prog"></div></div>
  <div class="q-box"><div class="q-text" id="q-text"></div></div>
  <div class="answers" id="answers"></div>
</div>

<!-- Feedback -->
<div id="feedback" class="screen">
  <div class="fb-mark" id="fb-mark"></div>
  <div class="fb-word" id="fb-word"></div>
  <div class="fb-pts"  id="fb-pts"></div>
  <div class="fb-ans"  id="fb-ans"></div>
</div>

<!-- Results -->
<div id="results" class="screen">
  <div class="res-label">Final score</div>
  <div class="res-score" id="res-score">0</div>
  <div class="res-pts">points</div>
  <div class="bars" id="bars"></div>
  <button class="btn-play" onclick="start()">Play again</button>
</div>

<script>
var Q = [
  { q:'What does CSS stand for?',
    a:['Cascading Style Sheets','Computer Style System','Creative Sheet Syntax','Coded Styling Standard'], c:0, t:20 },
  { q:'Which data structure is LIFO?',
    a:['Queue','Stack','Linked List','Tree'], c:1, t:20 },
  { q:'Time complexity of binary search?',
    a:['O(n)','O(n²)','O(log n)','O(1)'], c:2, t:20 },
  { q:'Which React hook handles side effects?',
    a:['useState','useRef','useEffect','useMemo'], c:2, t:15 },
  { q:'"Not Found" HTTP status code?',
    a:['200','301','403','404'], c:3, t:15 },
  { q:'Which is NOT a JavaScript type?',
    a:['undefined','boolean','character','symbol'], c:2, t:20 },
  { q:'What does git stash do?',
    a:['Deletes changes','Saves changes temporarily','Commits silently','Pushes to remote'], c:1, t:20 },
  { q:'Algorithm for shortest path in a graph?',
    a:['Merge Sort','Dijkstra\'s','Binary Search','Quicksort'], c:1, t:20 },
  { q:'SQL stands for?',
    a:['Structured Query Language','Simple Question Logic','System Queue Layer','Standard Query Loop'], c:0, t:15 },
  { q:'What is a REST API?',
    a:['A database type','A web service architecture style','A JavaScript framework','A CSS methodology'], c:1, t:20 },
];

var LETTERS = ['A','B','C','D'];
var CIRC = 2 * Math.PI * 23; // ~144.5

var idx, score, results, tick, timeLeft;

function start() {
  idx=0; score=0; results=[];
  show('question');
  load();
}

function load() {
  var q = Q[idx];
  timeLeft = q.t;

  document.getElementById('q-num').textContent   = (idx+1) + ' / ' + Q.length;
  document.getElementById('hdr-score').textContent = score.toLocaleString() + ' pts';
  document.getElementById('prog').style.width    = (idx / Q.length * 100) + '%';

  // re-trigger animation on q-text
  var qt = document.getElementById('q-text');
  qt.style.animation = 'none';
  qt.textContent = q.q;
  void qt.offsetWidth;
  qt.style.animation = '';

  var box = document.getElementById('answers');
  box.innerHTML = '';
  q.a.forEach(function(text, i) {
    var b = document.createElement('button');
    b.className = 'ans c' + i;
    b.innerHTML = '<span class="ans-letter">' + LETTERS[i] + '</span>' + text;
    b.onclick = function(){ pick(i); };
    box.appendChild(b);
  });

  runTimer(q.t);
}

function runTimer(secs) {
  clearInterval(tick);
  var arc  = document.getElementById('t-arc');
  var num  = document.getElementById('t-num');
  var wrap = document.getElementById('timer-wrap');
  wrap.className = 'timer-wrap';
  arc.style.strokeDasharray = CIRC;
  var started = Date.now();

  tick = setInterval(function(){
    timeLeft = Math.max(0, secs - (Date.now()-started)/1000);
    var frac = timeLeft / secs;
    arc.style.strokeDashoffset = CIRC * (1 - frac);
    num.textContent = Math.ceil(timeLeft);
    wrap.className = 'timer-wrap' + (timeLeft < 5 ? ' crit' : timeLeft < 10 ? ' warn' : '');
    if (timeLeft <= 0) { clearInterval(tick); pick(-1); }
  }, 80);
}

function pick(chosen) {
  clearInterval(tick);
  var q  = Q[idx];
  var ok = chosen === q.c;
  var pts = ok ? Math.round(1000 * (timeLeft / q.t)) : 0;
  score += pts;
  results.push({ ok:ok, t: Q[idx].t - timeLeft });

  document.querySelectorAll('.ans').forEach(function(b, i){
    b.disabled = true;
    if (i === q.c) b.classList.add('correct');
    else           b.classList.add('wrong');
  });

  setTimeout(function(){ feedback(ok, pts, q.a[q.c]); }, 750);
}

function feedback(ok, pts, correctAns) {
  var mark = document.getElementById('fb-mark');
  mark.textContent   = ok ? '✓' : '✗';
  mark.style.color   = ok ? '#22c55e' : '#ef4444';
  mark.style.animation = 'none'; void mark.offsetWidth; mark.style.animation = '';

  document.getElementById('fb-word').textContent = ok
    ? ['Correct!','Nice!','Yes!','Let\'s go!'][Math.floor(Math.random()*4)]
    : 'Wrong';
  document.getElementById('fb-pts').textContent  = ok ? '+' + pts.toLocaleString() + ' pts' : '';
  document.getElementById('fb-ans').textContent  = ok ? '' : 'Answer: ' + correctAns;
  show('feedback');

  setTimeout(function(){
    idx++;
    if (idx < Q.length) { show('question'); load(); }
    else showResults();
  }, 1500);
}

function showResults() {
  document.getElementById('res-score').textContent = score.toLocaleString();
  document.getElementById('bars').innerHTML = results.map(function(r,i){
    var pct = r.ok ? Math.max(6, Math.round((1 - r.t/Q[i].t)*100)) : 100;
    return '<div class="bar-row">' +
      '<span class="bar-n">'+(i+1)+'</span>' +
      '<div class="bar-track"><div class="bar-fill '+(r.ok?'ok':'bad')+'" style="width:0%" data-w="'+pct+'%"></div></div>' +
      '<span class="bar-t">'+(r.ok ? r.t.toFixed(1)+'s' : '—')+'</span>' +
    '</div>';
  }).join('');
  show('results');
  // animate bars in
  setTimeout(function(){
    document.querySelectorAll('.bar-fill').forEach(function(el){
      el.style.width = el.getAttribute('data-w');
    });
  }, 80);
}

function show(id) {
  document.querySelectorAll('.screen').forEach(function(s){
    s.classList.toggle('active', s.id === id);
  });
}
</script>
</body>
</html>
