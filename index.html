<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crow Debugger</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Crow Debugger</h1>
        </header>
        <main>
            <div id="duck-container">
                <div id="speech-bubble" class="hidden"></div>
                <svg id="duck" width="200" height="240" viewBox="0 0 200 240">
                    <g id="crow-body">
                        <!-- Stick Feet with 3 toes -->
                        <g id="feet" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round">
                            <!-- Left Foot -->
                            <line x1="100" y1="180" x2="100" y2="220" />
                            <line x1="100" y1="220" x2="90" y2="230" />
                            <line x1="100" y1="220" x2="100" y2="235" />
                            <line x1="100" y1="220" x2="110" y2="230" />
                            <line x1="130" y1="180" x2="130" y2="220" />
                            <line x1="130" y1="220" x2="120" y2="230" />
                            <line x1="130" y1="220" x2="130" y2="235" />
                            <line x1="130" y1="220" x2="140" y2="230" />
                        </g>

                        <circle cx="120" cy="120" r="70" fill="#333" stroke="#444" stroke-width="2" />
                        
                        <circle cx="70" cy="90" r="50" fill="#444" stroke="#555" stroke-width="2" />

                        <!-- Eyes (Sarcastic/Funny) - Positioned on the head -->
                        <!-- Eyes (Sarc

                        <g id="eyes">
                            <circle cx="45" cy="70" r="14" fill="white" />
                            <circle cx="75" cy="70" r="14" fill="white" />
                            <!-- Pupils  -->
                            <circle cx="40" cy="70" r="4" fill="#333" />
                            <circle cx="70" cy="70" r="4" fill="#333" />
                            <path d="M 32 63 Q 45 55 58 63" fill="none" stroke="#333" stroke-width="2" />
                            <path d="M 62 63 Q 75 55 88 63" fill="none" stroke="#333" stroke-width="2" />
                        </g>
                        <path id="beak" d="M 50 100 Q 25 90 5 105 L 50 120 Z" fill="#ccc" />
                        </g>
                </svg>
            </div>
            <div id="controls">
                <button id="record-btn">Start Debugging</button>
                <div id="status">Idle</div>
            </div>
            <div id="stats">
                <h2>Session Stats</h2>
                <p>Time spent: <span id="time-spent">0</span>s</p>
                <p>Words spoken (approx): <span id="word-count">0</span></p>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
