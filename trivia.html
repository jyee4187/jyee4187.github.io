<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Trivia</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0a10;
      color: #f2e9ee;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #root { width: 100%; max-width: 620px; }

    .center { text-align: center; color: #7a6e8a; font-size: 13px; }

    .meta {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .category {
      font-size: 10px;
      letter-spacing: 1px;
      color: #7a6e8a;
      text-transform: uppercase;
      flex: 1;
    }
    .difficulty {
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 2px;
    }
    .difficulty.easy   { color: #4caf50; border: 1px solid #2a4a2c; }
    .difficulty.medium { color: #f7a800; border: 1px solid #4a3a0a; }
    .difficulty.hard   { color: #e04060; border: 1px solid #4a1a2a; }
    .review-badge {
      font-size: 10px;
      color: #b35cff;
      border: 1px solid #3a1a5a;
      padding: 2px 7px;
      border-radius: 2px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .progress { font-size: 11px; color: #4a3a5a; letter-spacing: 1px; }

    .question {
      font-size: 17px;
      line-height: 1.55;
      margin-bottom: 24px;
      color: #f2e9ee;
    }

    .answers {
      display: grid;
      gap: 8px;
      margin-bottom: 20px;
    }
    .answer {
      background: #16121d;
      border: 1px solid #2e2537;
      color: #f2e9ee;
      padding: 13px 16px;
      text-align: left;
      font-size: 14px;
      line-height: 1.4;
      cursor: pointer;
      border-radius: 3px;
      transition: border-color 0.12s, background 0.12s;
    }
    .answer.available:hover { border-color: #b35cff; }
    .answer.correct  { border-color: #4caf50; background: #0f2a14; color: #7ddf80; }
    .answer.wrong    { border-color: #e04060; background: #2a0f14; color: #e04060; }
    .answer:disabled { cursor: default; }

    .reveal { margin-top: 4px; }
    .feedback {
      font-size: 13px;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .feedback.correct-text { color: #4caf50; }
    .feedback.wrong-text   { color: #e04060; }

    .next-btn {
      background: #1e1828;
      border: 1px solid #b35cff;
      color: #b35cff;
      padding: 10px 22px;
      font-size: 12px;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.12s;
    }
    .next-btn:hover { background: #2a1e3a; }

    .done { text-align: center; }
    .done h2 { font-size: 42px; letter-spacing: 2px; margin-bottom: 8px; color: #b35cff; }
    .done .muted { color: #7a6e8a; font-size: 13px; margin-bottom: 20px; }

    .review-list {
      list-style: none;
      margin-bottom: 24px;
      text-align: left;
      display: grid;
      gap: 12px;
    }
    .review-list li {
      border-left: 2px solid #2e2537;
      padding-left: 12px;
    }
    .review-q {
      display: block;
      font-size: 12px;
      color: #7a6e8a;
      margin-bottom: 3px;
      line-height: 1.4;
    }
    .review-a {
      display: block;
      font-size: 14px;
      color: #4caf50;
    }

    .progress-bar {
      height: 2px;
      background: #1e1828;
      border-radius: 1px;
      margin-bottom: 24px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #b35cff;
      transition: width 0.3s;
    }
  </style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
(function () {
  const { useState, useEffect, useCallback } = React;
  const h = React.createElement;

  function decode(str) {
    const t = document.createElement('textarea');
    t.innerHTML = str;
    return t.value;
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function processQ(q) {
    const answers = shuffle([
      { text: decode(q.correct_answer), correct: true },
      ...q.incorrect_answers.map(a => ({ text: decode(a), correct: false }))
    ]);
    return {
      question: decode(q.question),
      category: decode(q.category),
      difficulty: q.difficulty,
      answers,
      correct: decode(q.correct_answer),
    };
  }

  async function fetchQuestions(n = 10) {
    const res = await fetch(`https://opentdb.com/api.php?amount=${n}&type=multiple&encode=url3986`);
    const data = await res.json();
    if (data.response_code !== 0) throw new Error('API error');
    return data.results.map(q => ({
      ...q,
      question: decodeURIComponent(q.question),
      correct_answer: decodeURIComponent(q.correct_answer),
      incorrect_answers: q.incorrect_answers.map(decodeURIComponent),
      category: decodeURIComponent(q.category),
    })).map(processQ);
  }

  function DoneScreen({ score, total, wrong, onReplay }) {
    return h('div', { className: 'done' },
      h('h2', null, `${score} / ${total}`),
      wrong.length === 0
        ? h('p', { className: 'muted' }, 'clean sweep.')
        : h('div', null,
            h('p', { className: 'muted', style: { marginBottom: 16 } },
              `you missed ${wrong.length}. commit these:`),
            h('ul', { className: 'review-list' },
              wrong.map((q, i) =>
                h('li', { key: i },
                  h('span', { className: 'review-q' }, q.question),
                  h('span', { className: 'review-a' }, q.correct)
                )
              )
            )
          ),
      h('button', { className: 'next-btn', onClick: onReplay }, 'play again')
    );
  }

  function App() {
    const [phase, setPhase]       = useState('loading');
    const [questions, setQs]      = useState([]);
    const [current, setCurrent]   = useState(0);
    const [selected, setSelected] = useState(null);
    const [revealed, setRevealed] = useState(false);
    const [wrong, setWrong]       = useState([]);
    const [reviewMode, setReview] = useState(false);
    const [score, setScore]       = useState(0);

    function load() {
      setPhase('loading');
      setQs([]); setCurrent(0); setSelected(null);
      setRevealed(false); setWrong([]); setReview(false); setScore(0);
      fetchQuestions(10)
        .then(qs => { setQs(qs); setPhase('playing'); })
        .catch(() => setPhase('error'));
    }

    useEffect(() => { load(); }, []);

    const q = questions[current];

    function handleAnswer(answer) {
      if (revealed) return;
      setSelected(answer);
      setRevealed(true);
      if (answer.correct) {
        setScore(s => s + 1);
      } else if (!reviewMode) {
        setWrong(w => [...w, q]);
      }
    }

    function handleNext() {
      const last = current + 1 >= questions.length;
      if (last) {
        if (!reviewMode && wrong.length > 0) {
          const freshWrong = wrong.map(wq => ({
            ...wq, answers: shuffle(wq.answers)
          }));
          setQs(freshWrong);
          setCurrent(0); setSelected(null); setRevealed(false);
          setReview(true);
        } else {
          setPhase('done');
        }
      } else {
        setCurrent(c => c + 1);
        setSelected(null);
        setRevealed(false);
      }
    }

    if (phase === 'loading') return h('div', { className: 'center' }, 'loading questions…');
    if (phase === 'error')   return h('div', { className: 'center' },
      'failed to load. check your connection and ',
      h('button', { className: 'next-btn', style: { marginLeft: 8 }, onClick: load }, 'retry')
    );
    if (phase === 'done')    return h(DoneScreen, { score, total: 10, wrong, onReplay: load });

    const pct = ((current) / questions.length) * 100;
    const nextLabel = current + 1 >= questions.length
      ? (!reviewMode && wrong.length > 0 ? `review ${wrong.length} missed →` : 'finish')
      : 'next →';

    return h('div', null,
      h('div', { className: 'progress-bar' },
        h('div', { className: 'progress-fill', style: { width: pct + '%' } })
      ),
      h('div', { className: 'meta' },
        h('span', { className: 'category' }, q.category),
        h('span', { className: 'difficulty ' + q.difficulty }, q.difficulty),
        reviewMode ? h('span', { className: 'review-badge' }, 'review round') : null,
        h('span', { className: 'progress' }, `${current + 1} / ${questions.length}`)
      ),
      h('p', { className: 'question' }, q.question),
      h('div', { className: 'answers' },
        q.answers.map((a, i) =>
          h('button', {
            key: i,
            className: 'answer' +
              (revealed && a.correct ? ' correct' : '') +
              (revealed && selected === a && !a.correct ? ' wrong' : '') +
              (!revealed ? ' available' : ''),
            onClick: () => handleAnswer(a),
            disabled: revealed,
          }, a.text)
        )
      ),
      revealed && h('div', { className: 'reveal' },
        selected.correct
          ? h('p', { className: 'feedback correct-text' }, '✓ correct')
          : h('p', { className: 'feedback wrong-text' },
              `✗  ${q.correct}`),
        h('button', { className: 'next-btn', onClick: handleNext }, nextLabel)
      )
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App, null));
})();
</script>
</body>
</html>
